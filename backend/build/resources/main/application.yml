server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: autotag-docs-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:app_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Configuración de Almacenamiento Compartido
storage:
  upload-dir: ${STORAGE_UPLOAD_DIR:../shared-storage/uploads}
  allowed-content-types:
    - application/pdf

# Orquestador AI (n8n Webhook Triggers)
n8n:
  webhook:
    url: ${N8N_WEBHOOK_URL:http://localhost:5678/webhook/process-pdf}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  backend-callback-base-url: ${BACKEND_CALLBACK_BASE_URL:http://host.docker.internal:8080}

# Base de Datos Vectorial (Qdrant)
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  collection: ${QDRANT_COLLECTION:autotag_documents}
  vector-size: 384
  distance-metric: Cosine

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.autotag.docs: DEBUG
