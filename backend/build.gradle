plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.autotag'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. API REST y Gestión Multipart para PDFs
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 2. WebClient Reactivo (Despacho asíncrono de Triggers a n8n y Qdrant)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // 3. Persistencia Relacional con PostgreSQL (DBeaver)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // 4. Bean Validation (Validación de Callbacks y DTOs)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 5. Actuator (Monitoreo de estado y métricas)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 6. Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
